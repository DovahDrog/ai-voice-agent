[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-voice-agent-tools"
version = "1.0.0"
description = "Privacy-first voice agent tool backend with offline demos and optional messaging adapters"
requires-python = ">=3.11"
authors = [{name = "Harley Katt"}]
dependencies = ["fastapi==0.143.0", "uvicorn==0.54.0", "pydantic==2.14.1"]

[project.optional-dependencies]
test = ["httpx==0.28.1", "httpx2==2.12.0", "jsonschema==4.26.0", "pytest==9.1.1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["voice_tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
